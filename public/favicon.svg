<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#0a0b0e"/>

  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="26" stroke="#A6FF00" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 3"/>

  <!-- Inner accent ring -->
  <circle cx="32" cy="32" r="21" stroke="#A6FF00" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Neon dot accent top-right -->
  <circle cx="48" cy="16" r="3" fill="#A6FF00" fill-opacity="0.85"/>
  <circle cx="48" cy="16" r="5" fill="#A6FF00" fill-opacity="0.15"/>

  <!-- Letter "G" — bold, centered, Outfit-like geometry -->
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="'Outfit', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="30"
    fill="#A6FF00"
    letter-spacing="-1"
  >G</text>

  <!-- Subtle bottom glow line -->
  <rect x="20" y="51" width="24" height="1.5" rx="1" fill="#A6FF00" fill-opacity="0.4"/>
</svg>